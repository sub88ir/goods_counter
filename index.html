<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스마트 수기 재고 카운터</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; }
    .touch-btn { touch-action: manipulation; user-select: none; }
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; }
  </style>
</head>
<body class="bg-slate-100 min-h-screen pb-24 text-slate-800 font-sans">

  <!-- 상단 헤더 -->
  <header class="bg-slate-900 text-white sticky top-0 z-30 shadow-md">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold tracking-tight flex items-center gap-2">
          📦 수기 재고 카운터
        </h1>
        <p id="syncStatus" class="text-xs text-slate-400">기기 내부 저장됨 (LocalStorage)</p>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="syncFromGitHub()" id="btnPull" class="hidden touch-btn bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-2 rounded-lg border border-slate-700 font-medium">
          📥 불러오기
        </button>
        <button onclick="syncToGitHub()" id="btnPush" class="hidden touch-btn bg-emerald-600 hover:bg-emerald-500 text-xs px-2.5 py-2 rounded-lg font-bold shadow">
          ☁️ 서버저장
        </button>
        <button onclick="openModal()" class="touch-btn bg-slate-800 hover:bg-slate-700 text-xs px-2.5 py-2 rounded-lg border border-slate-700">
          ⚙️ GitHub 설정
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-xl mx-auto px-3 pt-4">

    <!-- 품목 추가 및 색상 선택 영역 -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200 mb-4 relative">
      <label class="block text-xs font-bold text-slate-500 mb-2">새 품목 추가 & 태그 색상 선택</label>
      
      <!-- 색상 팔레트 선택 -->
      <div id="colorPicker" class="flex items-center gap-2.5 mb-3">
        <!-- JS에서 렌더링 -->
      </div>

      <!-- 입력창 & 추가 버튼 -->
      <div class="flex gap-2 relative">
        <div class="relative flex-1">
          <input type="text" id="itemInput" autocomplete="off" placeholder="예: 패딩솜 탄소매트 더블" 
            class="w-full px-3.5 py-3 rounded-xl border border-slate-300 focus:border-slate-900 focus:outline-none text-base font-medium"
            oninput="handleInput()" onkeydown="handleKeydown(event)">
          <!-- 자동완성 드롭다운 -->
          <div id="autocompleteList" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-xl shadow-lg max-h-52 overflow-y-auto z-40 divide-y divide-slate-100"></div>
        </div>
        <button onclick="addItem()" class="touch-btn bg-slate-900 active:bg-slate-700 text-white font-bold px-5 rounded-xl shrink-0">
          추가
        </button>
      </div>

      <!-- 빠른 추천 칩 (단어장) -->
      <div id="historySection" class="mt-3 pt-2.5 border-t border-slate-100 hidden">
        <div class="flex items-center justify-between mb-1.5">
          <span class="text-[11px] font-semibold text-slate-400">최근 등록 단어장 (터치하여 바로 추가)</span>
        </div>
        <div id="historyChips" class="flex flex-wrap gap-1.5"></div>
      </div>
    </section>

    <!-- 필터 및 요약 바 -->
    <div class="flex items-center justify-between px-1 mb-2">
      <div class="flex items-center gap-1.5 overflow-x-auto py-1" id="filterBar">
        <!-- 색상별 필터 칩 -->
      </div>
      <div class="text-xs font-bold text-slate-500 shrink-0 ml-2">
        총 <span id="totalTypes" class="text-slate-900">0</span>종 / <span id="totalCount" class="text-emerald-600">0</span>개
      </div>
    </div>

    <!-- 재고 리스트 영역 -->
    <section id="inventoryList" class="space-y-2.5">
      <!-- JS에서 렌더링 -->
    </section>

  </main>

  <!-- GitHub 설정 모달 -->
  <div id="githubModal" class="hidden fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-5 shadow-xl">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-base font-bold text-slate-900">☁️ GitHub 세이브파일 연동 설정</h2>
        <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
      </div>
      <div class="space-y-3 text-sm">
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">GitHub 아이디 (Owner)</label>
          <input type="text" id="ghOwner" placeholder="예: honggildong" class="w-full px-3 py-2 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">저장소 이름 (Repository)</label>
          <input type="text" id="ghRepo" placeholder="예: inventory-app" class="w-full px-3 py-2 border rounded-lg">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-600 mb-1">Personal Access Token (repo 권한 체크 필수)</label>
          <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" class="w-full px-3 py-2 border rounded-lg">
        </div>
        <p class="text-xs text-slate-500 bg-slate-50 p-2.5 rounded-lg leading-relaxed">
          설정 저장 후 상단의 <b>[☁️ 서버저장]</b>을 누르면 해당 저장소에 <code>inventory-data.json</code> 파일로 재고 데이터가 직접 저장됩니다.
        </p>
      </div>
      <div class="flex gap-2 mt-5">
        <button onclick="closeModal()" class="flex-1 py-2.5 rounded-xl border border-slate-300 font-semibold text-sm">취소</button>
        <button onclick="saveGithubConfig()" class="flex-1 py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm">설정 저장</button>
      </div>
    </div>
  </div>

  <script>
    // 7가지 색상 태그 테마 정의
    const COLORS = [
      { id: 'blue',   name: '블루',   bg: 'bg-blue-600',   light: 'bg-blue-50',   border: 'border-l-blue-600',   text: 'text-blue-700' },
      { id: 'rose',   name: '레드',   bg: 'bg-rose-500',   light: 'bg-rose-50',   border: 'border-l-rose-500',   text: 'text-rose-700' },
      { id: 'emerald',name: '그린',   bg: 'bg-emerald-600',light: 'bg-emerald-50',border: 'border-l-emerald-600',text: 'text-emerald-700' },
      { id: 'amber',  name: '옐로우', bg: 'bg-amber-500',  light: 'bg-amber-50',  border: 'border-l-amber-500',  text: 'text-amber-700' },
      { id: 'purple', name: '퍼플',   bg: 'bg-purple-600', light: 'bg-purple-50', border: 'border-l-purple-600', text: 'text-purple-700' },
      { id: 'cyan',   name: ' 민트',  bg: 'bg-cyan-600',   light: 'bg-cyan-50',   border: 'border-l-cyan-600',   text: 'text-cyan-700' },
      { id: 'slate',  name: '그레이', bg: 'bg-slate-600',  light: 'bg-slate-100', border: 'border-l-slate-600',  text: 'text-slate-700' }
    ];

    let items = JSON.parse(localStorage.getItem('inv_items_v2') || '[]');
    // 단어장: { title: '패딩솜 탄소매트 더블', color: 'blue' } 형태로 최근 색상까지 기억
    let vocab = JSON.parse(localStorage.getItem('inv_vocab_v2') || '[]');
    let selectedColor = 'blue';
    let activeFilter = 'all';

    // 초기화
    function init() {
      renderColorPicker();
      renderFilterBar();
      renderHistoryChips();
      renderList();
      checkGithubConfig();
    }

    function saveData() {
      localStorage.setItem('inv_items_v2', JSON.stringify(items));
      localStorage.setItem('inv_vocab_v2', JSON.stringify(vocab));
      renderFilterBar();
      renderHistoryChips();
    }

    function getColorObj(colorId) {
      return COLORS.find(c => c.id === colorId) || COLORS[0];
    }

    // 제목에서 첫 글자 추출 (특수문자/공백 제외 첫 글자)
    function getFirstChar(title) {
      const cleaned = title.trim().replace(/^[^\w가-힣]+/, '');
      return (cleaned.charAt(0) || title.trim().charAt(0) || '?').toUpperCase();
    }

    // 색상 선택기 렌더링
    function renderColorPicker() {
      const container = document.getElementById('colorPicker');
      container.innerHTML = COLORS.map(c => `
        <button type="button" onclick="selectColor('${c.id}')" 
          class="touch-btn w-7 h-7 rounded-full ${c.bg} flex items-center justify-center transition-transform ${selectedColor === c.id ? 'ring-2 ring-offset-2 ring-slate-900 scale-110' : 'opacity-70 hover:opacity-100'}">
          ${selectedColor === c.id ? '<span class="text-white text-xs font-bold">✓</span>' : ''}
        </button>
      `).join('');
    }

    function selectColor(colorId) {
      selectedColor = colorId;
      renderColorPicker();
    }

    // 색상 필터 바 렌더링
    function renderFilterBar() {
      const bar = document.getElementById('filterBar');
      const usedColors = [...new Set(items.map(i => i.color))];
      
      let html = `
        <button onclick="setFilter('all')" class="touch-btn text-xs px-2.5 py-1 rounded-full font-bold transition ${activeFilter === 'all' ? 'bg-slate-900 text-white' : 'bg-white text-slate-600 border border-slate-200'}">
          전체 (${items.length})
        </button>
      `;

      COLORS.forEach(c => {
        const count = items.filter(i => i.color === c.id).length;
        if (count > 0 || activeFilter === c.id) {
          html += `
            <button onclick="setFilter('${c.id}')" class="touch-btn text-xs px-2.5 py-1 rounded-full font-bold flex items-center gap-1 transition ${activeFilter === c.id ? c.bg + ' text-white' : 'bg-white text-slate-600 border border-slate-200'}">
              <span class="w-2 h-2 rounded-full ${activeFilter === c.id ? 'bg-white' : c.bg}"></span>
              ${count}
            </button>
          `;
        }
      });
      bar.innerHTML = html;
    }

    function setFilter(filterId) {
      activeFilter = filterId;
      renderFilterBar();
      renderList();
    }

    // 품목 추가
    function addItem(customTitle = null, customColor = null) {
      const input = document.getElementById('itemInput');
      const title = (customTitle !== null ? customTitle : input.value).trim();
      const color = customColor || selectedColor;

      if (!title) return;

      // 이미 리스트에 있는 품목이면 수량 +1 및 강조
      const existing = items.find(i => i.title === title);
      if (existing) {
        existing.count += 1;
        saveData();
        renderList(existing.id);
      } else {
        const newItem = {
          id: Date.now().toString(),
          title: title,
          count: 1,
          color: color
        };
        items.unshift(newItem);
        saveData();
        renderList(newItem.id);
      }

      // 단어장(자동완성)에 제목과 색상 저장
      const vocabIdx = vocab.findIndex(v => v.title === title);
      if (vocabIdx > -1) {
        vocab[vocabIdx].color = color;
      } else {
        vocab.unshift({ title, color });
      }
      saveData();

      input.value = '';
      document.getElementById('autocompleteList').classList.add('hidden');
      if (navigator.vibrate) navigator.vibrate(20);
    }

    // 카드 내 원형 아이콘 클릭 시 색상 즉시 순환 변경
    function cycleItemColor(id) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const currentIdx = COLORS.findIndex(c => c.id === item.color);
      const nextColor = COLORS[(currentIdx + 1) % COLORS.length].id;
      item.color = nextColor;

      // 단어장 색상도 함께 업데이트
      const v = vocab.find(v => v.title === item.title);
      if (v) v.color = nextColor;

      saveData();
      renderList();
      if (navigator.vibrate) navigator.vibrate(15);
    }

    // 수량 조절
    function updateCount(id, delta) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      item.count = Math.max(0, (parseInt(item.count) || 0) + delta);
      saveData();
      
      const inputEl = document.getElementById(`count-${id}`);
      if (inputEl) inputEl.value = item.count;
      updateSummary();
      if (navigator.vibrate) navigator.vibrate(15);
    }

    // 수량 직접 타이핑
    function handleDirectInput(id, val) {
      const item = items.find(i => i.id === id);
      if (!item) return;
      const parsed = parseInt(val, 10);
      item.count = isNaN(parsed) || parsed < 0 ? 0 : parsed;
      saveData();
      updateSummary();
    }

    // 품목 삭제
    function deleteItem(id) {
      if (!confirm('이 품목을 리스트에서 삭제할까요?\n(단어장 기록은 유지됩니다)')) return;
      items = items.filter(i => i.id !== id);
      saveData();
      renderList();
    }

    // 총합 요약 업데이트
    function updateSummary() {
      document.getElementById('totalTypes').textContent = items.length;
      const sum = items.reduce((acc, cur) => acc + (parseInt(cur.count) || 0), 0);
      document.getElementById('totalCount').textContent = sum.toLocaleString();
    }

    // 리스트 렌더링
    function renderList(highlightId = null) {
      const container = document.getElementById('inventoryList');
      updateSummary();

      const filtered = activeFilter === 'all' ? items : items.filter(i => i.color === activeFilter);

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="bg-white rounded-2xl p-8 text-center border border-dashed border-slate-300 text-slate-400 text-sm">
            등록된 재고 품목이 없습니다.<br>위 입력창에서 품목을 추가해 주세요.
          </div>
        `;
        return;
      }

      container.innerHTML = filtered.map(item => {
        const c = getColorObj(item.color);
        const firstChar = getFirstChar(item.title);
        const isHighlight = item.id === highlightId ? 'ring-2 ring-slate-900' : '';

        return `
          <div class="bg-white rounded-2xl p-3.5 shadow-sm border border-slate-200 border-l-8 ${c.border} ${isHighlight} flex flex-col gap-2.5 transition-all">
            <div class="flex items-center justify-between gap-2">
              <div class="flex items-center gap-2.5 min-w-0">
                <!-- 첫 글자 원형 아이콘 (터치 시 색상 변경) -->
                <button onclick="cycleItemColor('${item.id}')" title="터치하여 태그 색상 변경"
                  class="touch-btn w-10 h-10 rounded-full ${c.bg} text-white font-extrabold text-base flex items-center justify-center shrink-0 shadow-sm active:scale-90 transition-transform">
                  ${firstChar}
                </button>
                <div class="min-w-0">
                  <h3 class="font-bold text-slate-900 text-base leading-snug break-all">${item.title}</h3>
                  <span class="inline-block text-[11px] font-semibold px-2 py-0.5 rounded-md ${c.light} ${c.text} mt-0.5">
                    아이콘 터치 시 색상변경
                  </span>
                </div>
              </div>
              <button onclick="deleteItem('${item.id}')" class="touch-btn text-slate-300 hover:text-rose-500 p-1.5 text-lg font-bold shrink-0">
                &times;
              </button>
            </div>

            <!-- 하단 컨트롤 바 -->
            <div class="flex items-center justify-between bg-slate-50 rounded-xl p-1.5 border border-slate-100">
              <div class="flex items-center gap-1">
                <button onclick="updateCount('${item.id}', -10)" class="touch-btn px-2.5 py-2 rounded-lg bg-white border border-slate-200 text-xs font-bold text-slate-600 active:bg-slate-200">-10</button>
                <button onclick="updateCount('${item.id}', 10)" class="touch-btn px-2.5 py-2 rounded-lg bg-white border border-slate-200 text-xs font-bold text-slate-600 active:bg-slate-200">+10</button>
              </div>

              <div class="flex items-center gap-1.5">
                <button onclick="updateCount('${item.id}', -1)" 
                  class="touch-btn w-12 h-11 rounded-xl bg-white border border-slate-300 text-slate-800 text-2xl font-black flex items-center justify-center active:bg-slate-200 shadow-sm">
                  &minus;
                </button>
                <input type="number" id="count-${item.id}" value="${item.count}" 
                  oninput="handleDirectInput('${item.id}', this.value)"
                  class="w-16 h-11 text-center font-black text-lg bg-white border border-slate-300 rounded-xl focus:border-slate-900 focus:outline-none">
                <button onclick="updateCount('${item.id}', 1)" 
                  class="touch-btn w-12 h-11 rounded-xl ${c.bg} text-white text-2xl font-black flex items-center justify-center active:opacity-80 shadow-sm">
                  &#43;
                </button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // 단어장 칩 렌더링
    function renderHistoryChips() {
      const section = document.getElementById('historySection');
      const container = document.getElementById('historyChips');
      if (vocab.length === 0) {
        section.classList.add('hidden');
        return;
      }
      section.classList.remove('hidden');
      container.innerHTML = vocab.slice(0, 12).map(v => {
        const c = getColorObj(v.color);
        const firstChar = getFirstChar(v.title);
        return `
          <div class="inline-flex items-center rounded-full border border-slate-200 bg-slate-50 pr-1 text-xs font-medium text-slate-700">
            <button onclick="addItem('${v.title.replace(/'/g, "\\'")}', '${v.color}')" class="touch-btn flex items-center gap-1.5 pl-1.5 pr-2 py-1">
              <span class="w-4 h-4 rounded-full ${c.bg} text-white text-[10px] font-bold flex items-center justify-center">${firstChar}</span>
              <span>${v.title}</span>
            </button>
            <button onclick="removeVocab('${v.title.replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-rose-500 px-1 font-bold">&times;</button>
          </div>
        `;
      }).join('');
    }

    function removeVocab(title) {
      vocab = vocab.filter(v => v.title !== title);
      saveData();
    }

    // 자동완성 처리
    function handleInput() {
      const val = document.getElementById('itemInput').value.trim().toLowerCase();
      const listEl = document.getElementById('autocompleteList');
      if (!val) {
        listEl.classList.add('hidden');
        return;
      }
      const matches = vocab.filter(v => v.title.toLowerCase().includes(val));
      if (matches.length === 0) {
        listEl.classList.add('hidden');
        return;
      }
      listEl.innerHTML = matches.map(v => {
        const c = getColorObj(v.color);
        const firstChar = getFirstChar(v.title);
        return `
          <button type="button" onclick="addItem('${v.title.replace(/'/g, "\\'")}', '${v.color}')"
            class="w-full px-3.5 py-2.5 text-left text-sm font-medium hover:bg-slate-50 flex items-center gap-2.5">
            <span class="w-6 h-6 rounded-full ${c.bg} text-white text-xs font-bold flex items-center justify-center shrink-0">${firstChar}</span>
            <span class="truncate">${v.title}</span>
          </button>
        `;
      }).join('');
      listEl.classList.remove('hidden');
    }

    function handleKeydown(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addItem();
      }
    }

    // ---------------- GitHub API 세이브파일 연동 ----------------
    function openModal() {
      const cfg = JSON.parse(localStorage.getItem('inv_gh_config') || '{}');
      document.getElementById('ghOwner').value = cfg.owner || '';
      document.getElementById('ghRepo').value = cfg.repo || '';
      document.getElementById('ghToken').value = cfg.token || '';
      document.getElementById('githubModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('githubModal').classList.add('hidden');
    }

    function saveGithubConfig() {
      const owner = document.getElementById('ghOwner').value.trim();
      const repo = document.getElementById('ghRepo').value.trim();
      const token = document.getElementById('ghToken').value.trim();

      if (!owner || !repo || !token) {
        alert('모든 항목을 입력해 주세요.');
        return;
      }
      localStorage.setItem('inv_gh_config', JSON.stringify({ owner, repo, token }));
      closeModal();
      checkGithubConfig();
      alert('GitHub 연동 설정이 완료되었습니다. 상단의 [서버저장] 또는 [불러오기] 버튼을 사용할 수 있습니다.');
    }

    function checkGithubConfig() {
      const cfg = JSON.parse(localStorage.getItem('inv_gh_config') || '{}');
      if (cfg.owner && cfg.repo && cfg.token) {
        document.getElementById('btnPull').classList.remove('hidden');
        document.getElementById('btnPush').classList.remove('hidden');
        document.getElementById('syncStatus').textContent = `GitHub 연결됨 (${cfg.owner}/${cfg.repo})`;
      }
    }

    // UTF-8 안전한 Base64 인코딩/디코딩
    function utf8ToBase64(str) {
      return btoa(unescape(encodeURIComponent(str)));
    }
    function base64ToUtf8(str) {
      return decodeURIComponent(escape(atob(str)));
    }

    // GitHub 저장소에 inventory-data.json 저장
    async function syncToGitHub() {
      const cfg = JSON.parse(localStorage.getItem('inv_gh_config') || '{}');
      if (!cfg.token) return openModal();

      const btn = document.getElementById('btnPush');
      const origText = btn.innerHTML;
      btn.innerHTML = '⏳ 저장중...';
      btn.disabled = true;

      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/inventory-data.json`;
      const headers = {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      };

      try {
        // 기존 파일의 sha 값 조회 (덮어쓰기 위해 필요)
        let sha = null;
        const getRes = await fetch(url, { headers });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }

        const payload = {
          updatedAt: new Date().toISOString(),
          items: items,
          vocab: vocab
        };

        const body = {
          message: `재고 데이터 업데이트 (${new Date().toLocaleString('ko-KR')})`,
          content: utf8ToBase64(JSON.stringify(payload, null, 2))
        };
        if (sha) body.sha = sha;

        const putRes = await fetch(url, {
          method: 'PUT',
          headers,
          body: JSON.stringify(body)
        });

        if (!putRes.ok) throw new Error('저장 실패. 토큰 권한이나 저장소 이름을 확인하세요.');

        document.getElementById('syncStatus').textContent = `최근 서버 저장: ${new Date().toLocaleTimeString('ko-KR')}`;
        alert('✅ GitHub 저장소에 세이브 파일(inventory-data.json)이 성공적으로 저장되었습니다!');
      } catch (err) {
        alert('❌ 오류: ' + err.message);
      } finally {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }

    // GitHub 저장소에서 inventory-data.json 불러오기
    async function syncFromGitHub() {
      const cfg = JSON.parse(localStorage.getItem('inv_gh_config') || '{}');
      if (!cfg.token) return openModal();

      if (!confirm('GitHub에 저장된 세이브 파일로 현재 화면의 리스트를 덮어쓸까요?')) return;

      const btn = document.getElementById('btnPull');
      const origText = btn.innerHTML;
      btn.innerHTML = '⏳ 로딩중...';
      btn.disabled = true;

      const url = `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/inventory-data.json`;
      const headers = {
        'Authorization': `token ${cfg.token}`,
        'Accept': 'application/vnd.github.v3+json'
      };

      try {
        const res = await fetch(url, { headers, cache: 'no-store' });
        if (!res.ok) throw new Error('저장된 inventory-data.json 파일을 찾을 수 없습니다.');

        const fileData = await res.json();
        const decoded = JSON.parse(base64ToUtf8(fileData.content));

        items = decoded.items || [];
        vocab = decoded.vocab || [];
        saveData();
        renderList();

        document.getElementById('syncStatus').textContent = `최근 불러오기: ${new Date().toLocaleTimeString('ko-KR')}`;
        alert('✅ GitHub에서 세이브 데이터를 성공적으로 불러왔습니다!');
      } catch (err) {
        alert('❌ 오류: ' + err.message);
      } finally {
        btn.innerHTML = origText;
        btn.disabled = false;
      }
    }

    init();
  </script>
</body>
</html>
